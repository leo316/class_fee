<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班费管理 · class_fee</title>
  <meta name="description" content="大学生班费管理网站 - 收缴、支出、流水、统计与公示。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- 登录遮罩 -->
  <div id="login" class="login-overlay">
    <div class="login-card">
      <div class="brand"><span class="logo">💰</span> 班费管理</div>
      <p class="login-sub">班级班费线上化管理与公示平台（演示原型）</p>
      <label class="field">
        <span>你的姓名</span>
        <input id="login-name" type="text" placeholder="如：张三 / 班长" />
      </label>
      <label class="field">
        <span>身份</span>
        <select id="login-role">
          <option value="admin">班委（可记账）</option>
          <option value="member">成员（只读查看）</option>
        </select>
      </label>
      <button id="login-btn" class="btn btn-primary btn-block">进入</button>
      <p class="login-tip">演示数据保存在本机浏览器；班委可记账，成员仅可查看。</p>
    </div>
  </div>

  <!-- 应用主体 -->
  <div id="app" class="app" style="display:none">
    <aside class="sidebar">
      <div class="brand"><span class="logo">💰</span> 班费管理</div>
      <nav id="nav">
        <a href="#dashboard" class="nav-item">📊 仪表盘</a>
        <a href="#members" class="nav-item">👥 成员管理</a>
        <a href="#income" class="nav-item">💵 班费收缴</a>
        <a href="#expense" class="nav-item">🧾 支出记录</a>
        <a href="#ledger" class="nav-item">📒 收支流水</a>
        <a href="#reports" class="nav-item">📈 统计报表</a>
        <a href="#settings" class="nav-item">⚙️ 设置</a>
      </nav>
      <div class="side-foot">
        <div id="user-box" class="user-box"></div>
        <button id="logout-btn" class="btn btn-ghost btn-block">退出登录</button>
      </div>
    </aside>

    <main class="content">
      <div id="view"></div>
    </main>
  </div>

  <!-- 通用弹窗 -->
  <div id="modal" class="modal" style="display:none">
    <div class="modal-card">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="modal-x">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
